name: Build y deploy a HostGator

on:
  push:
    branches: [main]
  workflow_dispatch: # te permite disparar el deploy manualmente desde la pestaña Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Build del sitio (incluye indexado de Pagefind)
        run: npm run build

      - name: Deploy por FTPS a HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # HostGator soporta FTPS; evitá FTP plano, viaja sin cifrar
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }} # normalmente /public_html/
          dangerous-clean-slate: false # ver nota en README antes de activar esto en true
          exclude: |
            **/.git*
            **/.git*/**
            **/cgi-bin/**
            **/.well-known/**
